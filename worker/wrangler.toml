name = "lifeparty-benevoles"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

# https://lifeparty-benevoles.natquinson.workers.dev/api/planning
[vars]
ORIGINES = "https://natquinson-cmd.github.io,https://choisislavie.org,https://www.choisislavie.org"

[[durable_objects.bindings]]
name = "PLANNING"
class_name = "Planning"

[[durable_objects.bindings]]
name = "FAMILLES"
class_name = "Familles"

[[services]]
binding = "COURRIEL"
service = "contact-form-choisislavie"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Planning"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Familles"]

# Secrets (wrangler secret put) : CODE_ORGANISATION (mode organisation de la page), SEL_IP (sel du hachage des IP),
# SECRET_INTERNE (partage avec contact-form-choisislavie, qui envoie les e-mails via Brevo)
